name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    name: Backend — testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mundo
          POSTGRES_PASSWORD: mundo_dev
          POSTGRES_DB: operacao_mundo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mundo -d operacao_mundo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mundo:mundo_dev@localhost:5433/operacao_mundo?schema=public
      JWT_SECRET: ci-only-secret
      AI_ENABLED: 'false'
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      # Regras puras + testes de geração (contra o Postgres do serviço acima).
      - run: npm test

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # `prebuild` roda o check-routes.mjs automaticamente.
      - run: npm run build
